<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Urban Kings</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
    }

    header {
      background: black;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: 40px;
    }

    .btn {
      background: white;
      color: black;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .productos {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .producto {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      width: 200px;
    }

    .producto img {
      width: 100%;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: black;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  URBAN KINGS 👑
</header>

<section class="hero">
  <h1>Viste como un rey 🔥</h1>
  <p>La nueva generación de streetwear</p>
  <a href="https://www.temu.com" class="btn" target="_blank">Compra ahora</a>
</section>

<section class="productos">

  <div class="producto">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="Camiseta">
    <h3>Camiseta Negra</h3>
    <p>25€</p>
  </div>

  <div class="producto">
    <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf" alt="Sudadera">
    <h3>Sudadera Blanca</h3>
    <p>40€</p>
  </div>

  <div class="producto">
    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="Gorra">
    <h3>Gorra Urban</h3>
    <p>15€</p>
  </div>

</section>

<footer>
  © 2026 Urban Kings
</footer>

</body>
</html>
