<!DOCTYPE html>
<html>
<head>
  <title>Urban Kings</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: black;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 30px;
      font-weight: bold;
      background: gold;
      color: black;
    }

    .hero {
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 50px;
    }

    .btn {
      background: gold;
      color: black;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    footer {
  margin-top: 50px;
  padding: 20px;
  background: #111;
}

.productos {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.producto {
  background: #222;
  padding: 10px;
  width: 150px;
  border-radius: 10px;
}

.producto img {
  width: 100%;
  border-radius: 10px;
}
  </style>
</head>

<body>

<header>URBAN KINGS 👑</header>

<div class="hero">
  <h1>Streetwear moderno</h1>
  <p>Ropa con estilo. Sé diferente.</p>
  <br>
  <a class="btn" href="#productos">Comprar ahora</a>
</div>
<div class="productos" id="productos">

  <div class="producto">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80">
    <h3>Camiseta Negra</h3>
    <p>20€</p>
  </div>

  <div class="producto">
    <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=400&q=80">
    <h3>Sudadera Blanca</h3>
    <p>35€</p>
  </div>

</div>

<footer>
  © 2026 Urban Kings
</footer>

</body>
</html>
